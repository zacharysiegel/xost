[package]
name = "xost"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.*"
chromiumoxide = "0.9.*"
clap = { version = "4.6.*", features = ["derive"] }
futures = "0.3.*"
jiff = "1.0.*"
minimer = "2.2.*"
nix = { version = "0.32.*", features = ["signal", "hostname"] }
rpassword = "7.5.*"
rusqlite = { version = "0.42.*", features = ["bundled"] }
secr = "1.2.*"
serde_json = "1.0.*"
simple-alert = { git = "https://github.com/zacharysiegel/simple-alert" }
tokio = { version = "1.54.*", features = ["macros", "rt-multi-thread", "time"] }
totp-rs = "6.0.*"
